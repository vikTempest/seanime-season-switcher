name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: python3 suite/build.py .
      - name: viktempest-ui.json matches the sources
        run: git diff --exit-code -- viktempest-ui.json || (echo "Run python3 suite/build.py . and commit viktempest-ui.json" && exit 1)
      - name: Smoke test
        run: node test/smoke.js
